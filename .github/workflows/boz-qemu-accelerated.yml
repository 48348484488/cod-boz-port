name: BOZ ARM Runtime - CPU Unthrottled

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/boz-qemu-accelerated.yml"
      - "src/s3e_gl.c"
      - "remote_build.py"

permissions:
  contents: read

concurrency:
  group: boz-qemu-accelerated
  cancel-in-progress: false

jobs:
  qemu-boz:
    runs-on: ubuntu-24.04
    # Debian carries armhf and amd64 packages in the same APT repositories.
    # This avoids architecture-specific Ubuntu Ports repository mismatches.
    container: debian:bookworm
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      BOZ_FETCH_REFERENCE_S3E: "1"
      BOZ_FETCH_OFFICIAL_GAME_ARCHIVE: "1"
      BOZ_OFFICIAL_GAME_ARCHIVE: "blackops_gles1.dz"
      # Historical CDN TLS hostname is invalid; strict SHA-256 validates HTTP bytes.
      BOZ_ALLOW_LEGACY_OFFICIAL_HTTP: "1"
      BOZ_RESOURCE_PROBE_ONLY: "0"
      BOZ_FAST_NULL_PROPERTY: "1"
      BOZ_FAST_SKIP_NULL_REGISTRATION: "1"
      BOZ_FAST_MINIMAL_TRACE: "1"
      BOZ_FAST_LATE_GL_DIAGNOSTIC: "1"
      BOZ_DIAGNOSTIC_LATE_TAP: "1"
      BOZ_RESOURCE_CONSUMPTION_TRACE: "1"
      BOZ_PC_SAMPLE_UNGUARDED: "1"
      BOZ_PC_SAMPLE_INTERVAL: "4"
      BOZ_QEMU_HOST_PROFILING: "1"
      BOZ_COMPAT_PNG_INPUT_LENGTH_FIX: "1"
      BOZ_FAST_PROPERTY_TIMEOUT: "260"
      BOZ_DISPLAY_SIZE: "640x480"
      BOZ_EXIT_AFTER_DIAGNOSTIC: "1"
      RUN_HOST_TESTS: "1"
      LP_NUM_THREADS: "1"
      GALLIUM_NUM_THREADS: "1"
      MESA_GLTHREAD: "false"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEODRIVER: "x11"

    steps:
      - name: Install QEMU and ARM hard-float Mesa/SDL2 libraries
        shell: bash
        run: |
          set -eux
          dpkg --add-architecture armhf
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl python3 make gcc libc6-dev:amd64 gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross binutils-arm-linux-gnueabihf qemu-user \
            xvfb xauth libsdl2-2.0-0:armhf libegl1:armhf libgles2:armhf \
            libgles1:armhf libgl1:armhf libglx-mesa0:armhf \
            libegl-mesa0:armhf libgl1-mesa-dri:armhf libasound2:armhf

      - uses: actions/checkout@v4

      - name: Run actual BOZ ARM loader with SHA-256-verified game resources
        shell: bash
        run: |
          set -uo pipefail
          # The one-shot CI mode exits immediately after the genuine report.
          # QEMU ending on its diagnostic deadline (rc=124) is expected.
          # Run the report assertions instead of aborting on shell -e.
          set +e
          timeout --signal=INT --kill-after=15s 540s \
            python3 -u remote_build.py > boz-ci-session.log 2>&1
          status=$?
          set -e
          echo "Diagnostic process exit status: $status"
          grep -F -e '[FAST_QEMU_HOST_PROFILE]' \
            -e '[FAST_RESOURCE_CONSUMPTION]' \
            -e '[FAST_PROPERTY_RESULT]' \
            -e '[OFFICIAL_ASSET_READY]' boz-ci-session.log | tail -n 18 || true
          if ! grep -Fq '[FAST_PROPERTY_RESULT]' boz-ci-session.log; then
            echo "::error::BOZ QEMU did not produce a completed diagnostic report"
            exit 1
          fi
          if ! grep -Fq '[OFFICIAL_ASSET_READY]' boz-ci-session.log; then
            echo "::error::Original BOZ resource pack was not SHA-256 verified"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          with open("public/runner-report.json", encoding="utf-8") as f:
              report = json.load(f)
          p = report.get("fast_property") or {}
          swaps = p.get("swap_progress_events") or []
          frames = p.get("captured_pngs") or []
          if not swaps or not frames:
              print("::error::No real BOZ framebuffer swap and screenshot recorded")
              sys.exit(1)
          if p.get("signal_11_count"):
              print("::error::BOZ ARM runtime crashed with signal 11")
              sys.exit(1)
          taps = p.get("diagnostic_tap_events") or []
          if len(taps) != 2:
              print(f"::error::Late frontend tap did not produce press/release: {taps}")
              sys.exit(1)
          if not any("n=130" in swap for swap in swaps):
              print("::error::No verified frame after the late frontend tap")
              sys.exit(1)
          print("Actual late S3E pointer events:", *taps, sep="\\n")
          texture_report = report.get("fast_texture_evidence") or {}
          snapshots = texture_report.get("size_totals") or []
          if not snapshots:
              print("::error::Texture dimension diagnostics were not recorded")
              sys.exit(1)
          print("Texture dimension snapshots:", *snapshots[-3:], sep="\\n")
          print(f"Validated genuine frame swaps: {len(swaps)}, PNG captures: {len(frames)}")
          print("BOZ diagnostic completed; visible menu and gameplay remain unverified.")
          PY

      - name: Upload only diagnostics and captured frames (never game data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boz-qemu-cpu-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            boz-ci-session.log
            public/runner-report.json
            public/boz-fast-property.log
            public/boz-swap-*.png
            public/boz_gl_upload_trace.log
