name: BOZ ARM Runtime - CPU Unthrottled

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/boz-qemu-accelerated.yml"

permissions:
  contents: read

concurrency:
  group: boz-qemu-accelerated
  cancel-in-progress: false

jobs:
  qemu-boz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      BOZ_FETCH_REFERENCE_S3E: "1"
      BOZ_FETCH_OFFICIAL_GAME_ARCHIVE: "1"
      BOZ_OFFICIAL_GAME_ARCHIVE: "blackops_gles1.dz"
      BOZ_RESOURCE_PROBE_ONLY: "0"
      BOZ_FAST_NULL_PROPERTY: "1"
      BOZ_FAST_SKIP_NULL_REGISTRATION: "1"
      BOZ_FAST_MINIMAL_TRACE: "1"
      BOZ_RESOURCE_CONSUMPTION_TRACE: "1"
      BOZ_PC_SAMPLE_UNGUARDED: "1"
      BOZ_PC_SAMPLE_INTERVAL: "4"
      BOZ_QEMU_HOST_PROFILING: "1"
      BOZ_COMPAT_PNG_INPUT_LENGTH_FIX: "1"
      BOZ_FAST_PROPERTY_TIMEOUT: "260"
      BOZ_DISPLAY_SIZE: "640x480"
      RUN_HOST_TESTS: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEODRIVER: "x11"

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM hard-float emulator and software graphics
        run: |
          set -eux
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross make qemu-user \
            xvfb xauth python3 \
            libsdl2-2.0-0:armhf libegl1:armhf libgles2:armhf \
            libgl1-mesa-dri:armhf libasound2t64:armhf

      - name: Run actual BOZ ARM loader with verified original resources
        shell: bash
        run: |
          set -uo pipefail
          # The diagnostic server intentionally keeps listening after the
          # measured QEMU test. Bound the whole job and preserve its report.
          timeout --signal=INT --kill-after=15s 540s \
            python3 -u remote_build.py > boz-ci-session.log 2>&1
          status=$?
          echo "Diagnostic process exit status: $status"
          grep -E '^\\[(FAST_QEMU_HOST_PROFILE|FAST_RESOURCE_CONSUMPTION|FAST_PROPERTY_RESULT|OFFICIAL_ASSET_READY|RUNNER)\\]' \
            boz-ci-session.log | tail -n 18 || true
          if ! grep -q '^\\[FAST_PROPERTY_RESULT\\]' boz-ci-session.log; then
            echo "::error::BOZ QEMU did not produce a completed diagnostic report"
            exit 1
          fi

      - name: Upload only diagnostics and captured frames (never game data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boz-qemu-cpu-diagnostic
          retention-days: 7
          if-no-files-found: warn
          path: |
            boz-ci-session.log
            public/runner-report.json
            public/boz-fast-property.log
            public/boz-swap-*.png
            public/boz_gl_upload_trace.log
